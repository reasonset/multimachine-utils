# Name of TYPE. default is default.
default:
  # Output directory: out videos $outdir/$title/$filename.webm
  outdir: /home/jrh/GameVideos/Play
  #
  # Source directory: source videos $sourcedir/$prefix/$filepath_on_list
  sourcedir: /home/jrh/GameVideos/Recorded
  #
  # Server host address.
  host: 192.168.1.64
  #
  # Own hostname. I recommend to use hostname.
  hostname: jrh_desktop1
  #
  # Server port number.
  port: 44000
  #
  # At a minimum, the number of ffmpeg threads that this host would run. If a host has fewer remaining candidates than the number held by hosts faster than itself, it will not be processed.
  holds: 8
  # Values that are more than a percentage drop-rate away from the mean are excluded from the power calculation. Default value is 0.4.
  #drop_rate: 0.2
  #
  # Power is not calculated and is assumed to have the power specified here.
  #presumptive_power: 1000000
  #
  # Power is calculated from the average of the specific titles specified here, rather than the average of the whole.
  #standard: Genshin
  #
  ########## HWACCEL ##########
  #
  # A list of codec formats for source files that use hardware decoding. The format should match the `codec_name` option in ffprobe.
  # hwdec: [h264, h265, vp9, av1]
  #
  # The hwaccel value in FFmpeg. This is automatically set even when hwaccel_device is specified.
  # hwaccel: vulkan
  #
  # The value of `hwaccel_device`. You can specify the file path of the render device. This is primarily used on hosts with multiple video cards. Since `/dev/dri/renderD*` values may change, I recommend using `/dev/dri/by-path/*-render`.
  # hwaccel_device: /dev/dri/by-path/pci-0000:0c:00.0-render
  #
  #############################